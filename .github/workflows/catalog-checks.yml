name: Catalog foundation checks

on:
  pull_request:
    paths:
      - 'prototype/**'
      - 'supabase/migrations/**'
      - '.github/workflows/catalog-checks.yml'
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: prototype/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run catalog unit tests
        run: node --experimental-strip-types --test tests/catalog.test.mjs
      - name: Build frontend
        run: npm run build
