<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#173F70" />
  <meta name="description" content="AGADE Eyewear. Marca independente de curadoria de óculos solares de inspiração brasileira. Conheça nossa primeira seleção." />
  <title>AGADE Eyewear — Óculos de sol e curadoria independente</title>
  <script>
    try {
      const saved = localStorage.getItem("agade-preview-theme");
      if (saved === "dark" || saved === "light") {
        document.documentElement.dataset.agadeTheme = saved;
      }
    } catch (_) {}
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
